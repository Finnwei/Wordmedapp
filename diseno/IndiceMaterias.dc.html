<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    body{margin:0;background:#FFFFFF;font-family:'Open Sans',system-ui,sans-serif;color:#323232;}
    a{color:#1F6797;} a:hover{color:#2980B9;}
    *{box-sizing:border-box;}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;flex:none;border-bottom:1px solid #DFE5EB;">
    <button style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;cursor:pointer;color:#5A6472;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <span style="font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#7C8797;">Wordmed</span>
    <button style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;cursor:pointer;color:#5A6472;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    </button>
  </div>

  <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;">

    <!-- Reciente: franja, no tarjeta -->
    <div style="padding:14px 18px 13px;background:#EFF3F6;border-bottom:1px solid #DFE5EB;display:flex;flex-direction:column;gap:7px;">
      <span style="font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#7C8797;">Reciente</span>
      <div style="display:flex;align-items:baseline;gap:12px;">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;">
          <span style="font-family:'Spectral',Georgia,serif;font-size:19px;font-weight:700;line-height:1.15;">Hipertiroidismo</span>
          <span style="font-size:11.5px;color:#7C8797;">Medicina Interna III · Endocrinología</span>
        </div>
        <span style="font-family:ui-monospace,Consolas,monospace;font-size:16px;font-weight:700;color:#7D399A;font-variant-numeric:tabular-nums;flex:none;">62%</span>
      </div>
      <div style="height:2px;background:#DFE5EB;border-radius:2px;overflow:hidden;">
        <div style="width:62%;height:100%;background:#8E44AD;"></div>
      </div>
    </div>

    <div style="flex:1;overflow:hidden;padding:16px 0 0;display:flex;flex-direction:column;">

      <span style="font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#7C8797;padding:0 18px 9px;">Materias</span>

      <div style="display:flex;flex-direction:column;">

        <div style="display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:13px;padding:0 18px;min-height:56px;border-top:1px solid #DFE5EB;">
          <span style="width:9px;height:9px;border-radius:50%;background:#2980B9;box-shadow:inset 0 0 0 1.5px #2980B9;"></span>
          <div style="display:flex;flex-direction:column;gap:1px;min-width:0;">
            <span style="font-size:15.5px;font-weight:600;line-height:1.25;">Infectología</span>
          </div>
          <span style="font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#7C8797;font-variant-numeric:tabular-nums;">13</span>
        </div>

        <div style="display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:13px;padding:0 18px;min-height:56px;border-top:1px solid #DFE5EB;">
          <span style="width:9px;height:9px;border-radius:50%;background:#8E44AD;"></span>
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
            <span style="font-size:15.5px;font-weight:600;line-height:1.25;">Medicina Interna III</span>
            <span style="font-size:11px;color:#7C8797;">Endocrino · Hemato · Reumato</span>
          </div>
          <span style="font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#7C8797;font-variant-numeric:tabular-nums;">16</span>
        </div>

        <div style="display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:13px;padding:0 18px;min-height:56px;border-top:1px solid #DFE5EB;">
          <span style="width:9px;height:9px;border-radius:50%;background:#008CBA;"></span>
          <div style="display:flex;flex-direction:column;gap:1px;min-width:0;">
            <span style="font-size:15.5px;font-weight:600;line-height:1.25;">Psiquiatría</span>
          </div>
          <span style="font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#7C8797;font-variant-numeric:tabular-nums;">4</span>
        </div>

        <div style="display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:13px;padding:0 18px;min-height:56px;border-top:1px solid #DFE5EB;border-bottom:1px solid #DFE5EB;opacity:.55;">
          <span style="width:9px;height:9px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px #C2CBD5;"></span>
          <div style="display:flex;flex-direction:column;gap:1px;min-width:0;">
            <span style="font-size:15.5px;font-weight:600;line-height:1.25;color:#5A6472;">Obstetricia</span>
            <span style="font-size:11px;color:#7C8797;">sin material todavía</span>
          </div>
          <span style="font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#7C8797;font-variant-numeric:tabular-nums;">—</span>
        </div>

      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
