<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    body{margin:0;background:#F5F7F9;font-family:'Open Sans',system-ui,sans-serif;color:#323232;}
    a{color:#1F6797;} a:hover{color:#2980B9;}
    *{box-sizing:border-box;}
    /* título arriba, pegado a la pestaña: todas las carpetas alinean igual */
    .carpeta{position:relative;border-radius:3px;padding:34px 14px 16px;min-height:132px;display:flex;flex-direction:column;justify-content:flex-start;gap:5px;border:1px solid #DFE5EB;}
    .pestana{position:absolute;top:0;left:-1px;height:24px;padding:0 11px;display:inline-flex;align-items:center;border-radius:3px 3px 0 0;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#FFFFFF;font-family:ui-monospace,Consolas,monospace;}
    .nombre{font-family:'Spectral',Georgia,serif;font-size:19px;font-weight:700;line-height:1.15;}
    .desc{font-size:11px;color:#7C8797;line-height:1.35;}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#F5F7F9;display:flex;flex-direction:column;overflow:hidden;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;flex:none;">
    <button style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;cursor:pointer;color:#5A6472;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <button style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;cursor:pointer;color:#5A6472;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    </button>
  </div>

  <div style="flex:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:24px;">

    <span style="font-family:'Spectral',Georgia,serif;font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em;">Wordmed</span>

    <div style="position:relative;background:color-mix(in srgb, #8E44AD 8%, #FFFFFF);border:1px solid #DFE5EB;border-radius:3px;padding:34px 15px 16px;box-shadow:0 1px 2px rgba(28,40,54,.05),0 8px 22px -14px rgba(28,40,54,.3);">
      <span class="pestana" style="background:#8E44AD;">Reciente</span>
      <div style="display:flex;align-items:flex-end;gap:12px;">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;">
          <span style="font-family:'Spectral',Georgia,serif;font-size:23px;font-weight:700;line-height:1.1;">Hipertiroidismo</span>
          <span style="font-size:12px;color:#7C8797;">Medicina Interna III · Endocrinología</span>
        </div>
        <span style="font-family:ui-monospace,Consolas,monospace;font-size:22px;font-weight:700;color:#7D399A;font-variant-numeric:tabular-nums;line-height:1;flex:none;">62%</span>
      </div>
      <div style="height:3px;background:#FFFFFF;border-radius:2px;overflow:hidden;margin-top:12px;">
        <div style="width:62%;height:100%;background:#8E44AD;"></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px;">

      <div class="carpeta" style="background:color-mix(in srgb, #27AE60 8%, #FFFFFF);">
        <span class="pestana" style="background:#27AE60;">13 temas</span>
        <span class="nombre">Infectología</span>
      </div>

      <div class="carpeta" style="background:color-mix(in srgb, #8E44AD 8%, #FFFFFF);">
        <span class="pestana" style="background:#8E44AD;">16 temas</span>
        <span class="nombre">Medicina Interna III</span>
        <span class="desc">Endocrino · Hemato · Reumato</span>
      </div>

      <div class="carpeta" style="background:color-mix(in srgb, #008CBA 8%, #FFFFFF);">
        <span class="pestana" style="background:#008CBA;">4 temas</span>
        <span class="nombre">Psiquiatría</span>
      </div>

      <div class="carpeta" style="background:#FFFFFF;border-style:dashed;border-color:#C2CBD5;">
        <span class="pestana" style="background:#C2CBD5;color:#5A6472;">Vacía</span>
        <span class="nombre" style="color:#7C8797;">Obstetricia</span>
      </div>

    </div>

  </div>
</div>
</x-dc>
</body>
</html>
