<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    body{margin:0;background:#F5F7F9;font-family:'Open Sans',system-ui,sans-serif;color:#323232;}
    a{color:#1F6797;} a:hover{color:#2980B9;}
    *{box-sizing:border-box;}
    .tema{position:relative;background:#FFFFFF;border:1px solid #DFE5EB;border-radius:3px;padding:26px 14px 14px;display:flex;flex-direction:column;}
    .marca{position:absolute;top:0;left:-1px;height:19px;padding:0 9px;display:inline-flex;align-items:center;border-radius:3px 3px 0 0;font-family:ui-monospace,Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;color:#FFFFFF;}
    .tit{font-family:'Spectral',Georgia,serif;font-size:18px;font-weight:700;line-height:1.2;}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#F5F7F9;display:flex;flex-direction:column;overflow:hidden;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;flex:none;">
    <button style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;cursor:pointer;color:#5A6472;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <button style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;cursor:pointer;color:#5A6472;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    </button>
  </div>

  <div style="margin:0 16px;background:#F6F0F9;border:1px solid #DFE5EB;border-top:3px solid #8E44AD;border-radius:3px;padding:15px;flex:none;display:flex;align-items:center;gap:12px;">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <span style="font-family:'Spectral',Georgia,serif;font-size:24px;font-weight:700;line-height:1.1;letter-spacing:-.015em;">Medicina Interna III</span>
      <span style="font-size:11.5px;color:#7C8797;">16 temas · 3 bloques</span>
    </div>
    <button style="display:flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 12px;background:#FFFFFF;border:1px solid #C2CBD5;border-radius:3px;cursor:pointer;font:inherit;flex:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7D399A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6m0 0-2.5-2.5M12 18l2.5-2.5"/></svg>
      <span style="font-size:12px;font-weight:600;color:#5A6472;">Programa</span>
    </button>
  </div>

  <div style="flex:1;overflow:hidden;padding:20px 16px 0;display:flex;flex-direction:column;gap:14px;">

    <div style="display:flex;align-items:center;gap:9px;">
      <span style="width:24px;height:2px;background:#8E44AD;flex:none;"></span>
      <span style="font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#7D399A;">Endocrinología</span>
      <span style="flex:1;height:1px;background:#DFE5EB;"></span>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="tema"><span class="marca" style="background:#8E44AD;">E1</span><span class="tit">Hipófisis y Eje Hipotálamo-Hipofisario</span></div>
      <div class="tema"><span class="marca" style="background:#8E44AD;">E2</span><span class="tit">Hiperprolactinemia y Prolactinomas</span></div>
      <div class="tema"><span class="marca" style="background:#8E44AD;">E3</span><span class="tit">Diabetes Insípida</span></div>
      <div class="tema"><span class="marca" style="background:#8E44AD;">E4</span><span class="tit">Insuficiencia Suprarrenal en el Adulto</span></div>
      <div class="tema"><span class="marca" style="background:#8E44AD;">E5</span><span class="tit">Síndrome de Cushing</span></div>
      <div class="tema"><span class="marca" style="background:#8E44AD;">E6</span><span class="tit">Tiroides e Hipotiroidismo</span></div>
      <div class="tema"><span class="marca" style="background:#8E44AD;">E7</span><span class="tit">Hipertiroidismo</span></div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
