<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    body{margin:0;background:#F5F7F9;font-family:'Open Sans',system-ui,sans-serif;color:#323232;}
    a{color:#1F6797;} a:hover{color:#2980B9;}
    *{box-sizing:border-box;}
    .item{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 18px;background:none;border:none;width:100%;cursor:pointer;font:inherit;text-align:left;color:#323232;}
    .item span{flex:1;font-size:15px;}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#F5F7F9;position:relative;overflow:hidden;">

  <!-- pantalla de atrás, atenuada -->
  <div style="position:absolute;inset:0;background:#F5F7F9;"></div>
  <div style="position:absolute;inset:0;background:rgba(28,40,54,.42);"></div>

  <!-- el cajón -->
  <div style="position:absolute;top:0;left:0;bottom:0;width:296px;background:#FFFFFF;box-shadow:0 0 40px -8px rgba(28,40,54,.45);display:flex;flex-direction:column;">

    <div style="padding:24px 18px 20px;border-bottom:1px solid #DFE5EB;display:flex;flex-direction:column;gap:3px;">
      <span style="font-family:'Spectral',Georgia,serif;font-size:26px;font-weight:700;line-height:1;letter-spacing:-.02em;">Wordmed</span>
      <span style="font-size:11.5px;color:#7C8797;">33 temas en 4 materias</span>
    </div>

    <div style="display:flex;flex-direction:column;padding:10px 0;">

      <button class="item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span>Modo oscuro</span>
        <span style="flex:none;width:40px;height:23px;border-radius:99px;background:#DFE5EB;position:relative;">
          <span style="position:absolute;top:2.5px;left:3px;width:18px;height:18px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(28,40,54,.3);"></span>
        </span>
      </button>

      <button class="item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4L10 8h9.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="m15.5 11.5 2 2-3.5 3.5h-2v-2z"/></svg>
        <span>Editar carpetas</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C2CBD5" stroke-width="2" stroke-linecap="round" style="flex:none;"><path d="m9 5 7 7-7 7"/></svg>
      </button>

      <button class="item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 0 0 6.3 5.7L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 13.7 5.3L20 16"/><path d="M20 20v-4h-4"/></svg>
        <span>Buscar actualizaciones</span>
        <span style="flex:none;font-size:11px;color:#7C8797;">al día</span>
      </button>

    </div>

    <div style="margin-top:auto;padding:16px 18px 20px;border-top:1px solid #DFE5EB;display:flex;flex-direction:column;gap:2px;">
      <span style="font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:#7C8797;">Contenido 4257804ec4bb</span>
      <span style="font-size:10.5px;color:#7C8797;">Sincronizado hoy, 11:42</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
