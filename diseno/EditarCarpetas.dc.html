<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    body{margin:0;background:#F5F7F9;font-family:'Open Sans',system-ui,sans-serif;color:#323232;}
    a{color:#1F6797;} a:hover{color:#2980B9;}
    *{box-sizing:border-box;}
    .carpeta{position:relative;border-radius:3px;padding:34px 14px 16px;min-height:132px;display:flex;flex-direction:column;justify-content:flex-start;gap:5px;border:1px solid #DFE5EB;}
    .pestana{position:absolute;top:0;left:-1px;height:24px;padding:0 11px;display:inline-flex;align-items:center;border-radius:3px 3px 0 0;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#FFFFFF;font-family:ui-monospace,Consolas,monospace;}
    .nombre{font-family:'Spectral',Georgia,serif;font-size:19px;font-weight:700;line-height:1.15;}
    .desc{font-size:11px;color:#7C8797;line-height:1.35;}
    /* botón multicolor: la rueda de color en la esquina de cada carpeta */
    .rueda{position:absolute;top:29px;right:8px;width:30px;height:30px;border-radius:50%;border:2px solid #FFFFFF;box-shadow:0 1px 4px rgba(28,40,54,.3);cursor:pointer;padding:0;
      background:conic-gradient(#E74C3C,#E67E22,#F1C40F,#2ECC71,#1ABC9C,#3498DB,#9B59B6,#E91E63,#E74C3C);}
    .agarre{position:absolute;bottom:9px;right:10px;display:flex;flex-direction:column;gap:2.5px;opacity:.5;}
    .agarre i{display:block;width:14px;height:1.5px;background:#5A6472;border-radius:1px;}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#F5F7F9;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <!-- barra del modo personalizar -->
  <div style="background:#EFF3F6;border-bottom:1px solid #C2CBD5;padding:13px 16px;flex:none;display:flex;align-items:center;gap:11px;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4L10 8h9.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="m15.5 11.5 2 2-3.5 3.5h-2v-2z"/></svg>
    <div style="flex:1;display:flex;flex-direction:column;gap:1px;">
      <span style="font-size:13.5px;font-weight:700;">Editar carpetas</span>
      <span style="font-size:11px;color:#7C8797;">Tocá la rueda para el color · mantené apretado para mover</span>
    </div>
  </div>

  <div style="flex:1;overflow:hidden;padding:20px 16px 0;display:flex;flex-direction:column;gap:14px;">

    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px;">

      <div class="carpeta" style="background:color-mix(in srgb, #27AE60 8%, #FFFFFF);">
        <span class="pestana" style="background:#27AE60;">13 temas</span>
        <button class="rueda"></button>
        <span class="nombre" style="padding-right:26px;">Infectología</span>
        <span class="agarre"><i></i><i></i><i></i></span>
      </div>

      <!-- la que se está arrastrando -->
      <div class="carpeta" style="background:color-mix(in srgb, #8E44AD 8%, #FFFFFF);transform:rotate(-1.6deg) scale(1.03);box-shadow:0 10px 26px -10px rgba(28,40,54,.5);border-color:#8E44AD;">
        <span class="pestana" style="background:#8E44AD;">16 temas</span>
        <button class="rueda"></button>
        <span class="nombre" style="padding-right:26px;">Medicina Interna III</span>
        <span class="desc">Endocrino · Hemato · Reumato</span>
        <span class="agarre" style="opacity:.9;"><i></i><i></i><i></i></span>
      </div>

      <div class="carpeta" style="background:color-mix(in srgb, #008CBA 8%, #FFFFFF);">
        <span class="pestana" style="background:#008CBA;">4 temas</span>
        <button class="rueda"></button>
        <span class="nombre" style="padding-right:26px;">Psiquiatría</span>
        <span class="agarre"><i></i><i></i><i></i></span>
      </div>

      <div class="carpeta" style="background:#FFFFFF;border-style:dashed;border-color:#C2CBD5;">
        <span class="pestana" style="background:#C2CBD5;color:#5A6472;">Vacía</span>
        <button class="rueda"></button>
        <span class="nombre" style="color:#7C8797;padding-right:26px;">Obstetricia</span>
        <span class="agarre"><i></i><i></i><i></i></span>
      </div>

    </div>

  </div>

  <!-- OK, esquina inferior derecha -->
  <button style="position:absolute;right:18px;bottom:22px;min-width:88px;height:52px;padding:0 22px;border:none;border-radius:3px;background:#27AE60;color:#FFFFFF;font:inherit;font-size:15px;font-weight:700;letter-spacing:.02em;cursor:pointer;box-shadow:0 4px 14px -4px rgba(39,174,96,.6);display:flex;align-items:center;justify-content:center;gap:8px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
    OK
  </button>

</div>
</x-dc>
</body>
</html>
