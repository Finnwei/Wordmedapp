<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    body{margin:0;background:#F5F7F9;font-family:'Open Sans',system-ui,sans-serif;color:#323232;}
    a{color:#1F6797;} a:hover{color:#2980B9;}
    *{box-sizing:border-box;}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#F5F7F9;display:flex;flex-direction:column;overflow:hidden;">

  <!-- barra superior -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;flex:none;">
    <button style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;cursor:pointer;color:#5A6472;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <span style="font-family:'Spectral',Georgia,serif;font-size:19px;font-weight:700;letter-spacing:-.01em;">Wordmed</span>
    <button style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;cursor:pointer;color:#5A6472;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    </button>
  </div>

  <div style="flex:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:22px;">

    <!-- Reciente -->
    <div style="display:flex;flex-direction:column;gap:8px;">
      <span style="font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#7C8797;">Reciente</span>
      <div style="background:#FFFFFF;border:1px solid #DFE5EB;border-left:4px solid #8E44AD;border-radius:3px;box-shadow:0 1px 2px rgba(28,40,54,.05),0 6px 18px -12px rgba(28,40,54,.22);padding:14px 15px;display:flex;align-items:flex-start;gap:12px;">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;">
          <span style="font-family:'Spectral',Georgia,serif;font-size:18px;font-weight:700;line-height:1.2;">Hipertiroidismo</span>
          <span style="font-size:12px;color:#7C8797;">Medicina Interna III · Endocrinología</span>
        </div>
        <div style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <span style="font-family:ui-monospace,Consolas,monospace;font-size:15px;font-weight:700;color:#7D399A;font-variant-numeric:tabular-nums;">62%</span>
          <div style="width:52px;height:3px;background:#EFF3F6;border-radius:2px;overflow:hidden;">
            <div style="width:62%;height:100%;background:#8E44AD;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Materias -->
    <div style="display:flex;flex-direction:column;gap:10px;">
      <span style="font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#7C8797;">Materias</span>

      <div style="display:flex;flex-direction:column;gap:10px;">

        <div style="background:#FFFFFF;border:1px solid #DFE5EB;border-left:4px solid #2980B9;border-radius:3px;box-shadow:0 1px 2px rgba(28,40,54,.05);padding:15px;display:flex;align-items:center;gap:12px;min-height:66px;">
          <div style="flex:1;display:flex;flex-direction:column;gap:2px;">
            <span style="font-family:'Spectral',Georgia,serif;font-size:17px;font-weight:700;">Infectología</span>
            <span style="font-size:12px;color:#7C8797;">13 temas</span>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2CBD5" stroke-width="2" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg>
        </div>

        <div style="background:#FFFFFF;border:1px solid #DFE5EB;border-left:4px solid #8E44AD;border-radius:3px;box-shadow:0 1px 2px rgba(28,40,54,.05);padding:15px;display:flex;align-items:center;gap:12px;min-height:66px;">
          <div style="flex:1;display:flex;flex-direction:column;gap:2px;">
            <span style="font-family:'Spectral',Georgia,serif;font-size:17px;font-weight:700;">Medicina Interna III</span>
            <span style="font-size:12px;color:#7C8797;">16 temas · Endocrino, Hemato, Reumato</span>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2CBD5" stroke-width="2" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg>
        </div>

        <div style="background:#FFFFFF;border:1px solid #DFE5EB;border-left:4px solid #008CBA;border-radius:3px;box-shadow:0 1px 2px rgba(28,40,54,.05);padding:15px;display:flex;align-items:center;gap:12px;min-height:66px;">
          <div style="flex:1;display:flex;flex-direction:column;gap:2px;">
            <span style="font-family:'Spectral',Georgia,serif;font-size:17px;font-weight:700;">Psiquiatría</span>
            <span style="font-size:12px;color:#7C8797;">4 temas</span>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2CBD5" stroke-width="2" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg>
        </div>

        <div style="background:#FFFFFF;border:1px solid #DFE5EB;border-left:4px solid #C2CBD5;border-radius:3px;padding:15px;display:flex;align-items:center;gap:12px;min-height:66px;opacity:.6;">
          <div style="flex:1;display:flex;flex-direction:column;gap:2px;">
            <span style="font-family:'Spectral',Georgia,serif;font-size:17px;font-weight:700;color:#5A6472;">Obstetricia</span>
            <span style="font-size:12px;color:#7C8797;">sin material todavía</span>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
