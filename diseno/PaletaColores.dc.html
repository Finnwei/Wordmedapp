<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    body{margin:0;background:#F5F7F9;font-family:'Open Sans',system-ui,sans-serif;color:#323232;}
    a{color:#1F6797;} a:hover{color:#2980B9;}
    *{box-sizing:border-box;}
    .grilla{display:grid;grid-template-columns:repeat(8, minmax(0,1fr));gap:7px;}
    .tono{aspect-ratio:1;border-radius:3px;border:none;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(28,40,54,.09);}
    .divisor{display:flex;align-items:center;gap:8px;padding:2px 0;}
    .divisor b{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#7C8797;}
    .divisor i{flex:1;height:1px;background:#DFE5EB;display:block;}
    .solapa{flex:1;min-height:38px;display:flex;align-items:center;justify-content:center;border:none;background:none;font:inherit;font-size:13.5px;font-weight:600;color:#7C8797;cursor:pointer;border-bottom:2px solid transparent;}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#F5F7F9;position:relative;overflow:hidden;display:flex;flex-direction:column;">

  <!-- lo que queda visible de las carpetas detrás -->
  <div style="padding:16px 16px 0;display:flex;flex-direction:column;gap:14px;flex:none;">
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:14px;">
      <div style="position:relative;background:color-mix(in srgb, #27AE60 8%, #FFFFFF);border:2px solid #27AE60;border-radius:3px;padding:34px 14px 16px;min-height:120px;display:flex;flex-direction:column;gap:5px;">
        <span style="position:absolute;top:-1px;left:-1px;height:24px;padding:0 11px;display:inline-flex;align-items:center;border-radius:3px 3px 0 0;background:#27AE60;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#FFFFFF;">13 temas</span>
        <span style="font-family:'Spectral',Georgia,serif;font-size:19px;font-weight:700;line-height:1.15;">Infectología</span>
      </div>
      <div style="position:relative;background:color-mix(in srgb, #8E44AD 8%, #FFFFFF);border:1px solid #DFE5EB;border-radius:3px;padding:34px 14px 16px;min-height:120px;display:flex;flex-direction:column;gap:5px;opacity:.45;">
        <span style="position:absolute;top:0;left:-1px;height:24px;padding:0 11px;display:inline-flex;align-items:center;border-radius:3px 3px 0 0;background:#8E44AD;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#FFFFFF;">16 temas</span>
        <span style="font-family:'Spectral',Georgia,serif;font-size:19px;font-weight:700;line-height:1.15;">Medicina Interna III</span>
      </div>
    </div>
  </div>

  <!-- panel -->
  <div style="margin-top:auto;background:#FFFFFF;border-top:1px solid #C2CBD5;border-radius:10px 10px 0 0;box-shadow:0 -8px 30px -12px rgba(28,40,54,.4);display:flex;flex-direction:column;flex:none;height:560px;">

    <div style="display:flex;justify-content:center;padding:9px 0 4px;flex:none;">
      <span style="width:38px;height:4px;border-radius:2px;background:#DFE5EB;"></span>
    </div>

    <div style="padding:2px 16px 0;display:flex;align-items:center;gap:10px;flex:none;">
      <span style="flex:1;font-size:13px;color:#7C8797;">Infectología</span>
      <span style="font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#7C8797;">#27AE60</span>
    </div>

    <div style="display:flex;gap:0;padding:8px 16px 0;border-bottom:1px solid #DFE5EB;flex:none;">
      <button class="solapa" style="color:#323232;border-bottom-color:#323232;">Colores</button>
      <button class="solapa">Estilos</button>
    </div>

    <div style="flex:1;overflow:hidden;padding:14px 16px 0;display:flex;flex-direction:column;gap:11px;">

      <div class="divisor"><b>Clínicos</b><i></i></div>
      <div class="grilla">
        <button class="tono" style="background:#27AE60;box-shadow:0 0 0 2px #FFFFFF, 0 0 0 4px #27AE60;"></button>
        <button class="tono" style="background:#1B8348;"></button>
        <button class="tono" style="background:#16A085;"></button>
        <button class="tono" style="background:#0E7C66;"></button>
        <button class="tono" style="background:#2980B9;"></button>
        <button class="tono" style="background:#1F6797;"></button>
        <button class="tono" style="background:#008CBA;"></button>
        <button class="tono" style="background:#00708F;"></button>
        <button class="tono" style="background:#8E44AD;"></button>
        <button class="tono" style="background:#7D399A;"></button>
        <button class="tono" style="background:#D4AC0D;"></button>
        <button class="tono" style="background:#8E7300;"></button>
        <button class="tono" style="background:#C0392B;"></button>
        <button class="tono" style="background:#A62F22;"></button>
        <button class="tono" style="background:#505050;"></button>
        <button class="tono" style="background:#7C8797;"></button>
      </div>

      <div class="divisor"><b>Pasteles</b><i></i></div>
      <div class="grilla">
        <button class="tono" style="background:#A8D5BA;"></button>
        <button class="tono" style="background:#B8E0D2;"></button>
        <button class="tono" style="background:#C6E2E9;"></button>
        <button class="tono" style="background:#A7C7E7;"></button>
        <button class="tono" style="background:#B5C7ED;"></button>
        <button class="tono" style="background:#C9B6E4;"></button>
        <button class="tono" style="background:#E0C3E8;"></button>
        <button class="tono" style="background:#F7C8D0;"></button>
        <button class="tono" style="background:#F9C6C6;"></button>
        <button class="tono" style="background:#F9D5A7;"></button>
        <button class="tono" style="background:#FDF0B2;"></button>
        <button class="tono" style="background:#E9EFC0;"></button>
        <button class="tono" style="background:#D6E5BD;"></button>
        <button class="tono" style="background:#E8DCC8;"></button>
        <button class="tono" style="background:#E4C1B9;"></button>
        <button class="tono" style="background:#D9D9E3;"></button>
      </div>

      <div class="divisor"><b>Vivos</b><i></i></div>
      <div class="grilla">
        <button class="tono" style="background:#E74C3C;"></button>
        <button class="tono" style="background:#FF5722;"></button>
        <button class="tono" style="background:#E67E22;"></button>
        <button class="tono" style="background:#FF9800;"></button>
        <button class="tono" style="background:#F1C40F;"></button>
        <button class="tono" style="background:#FFC107;"></button>
        <button class="tono" style="background:#8BC34A;"></button>
        <button class="tono" style="background:#2ECC71;"></button>
        <button class="tono" style="background:#1ABC9C;"></button>
        <button class="tono" style="background:#00BCD4;"></button>
        <button class="tono" style="background:#3498DB;"></button>
        <button class="tono" style="background:#2196F3;"></button>
        <button class="tono" style="background:#673AB7;"></button>
        <button class="tono" style="background:#9B59B6;"></button>
        <button class="tono" style="background:#E91E63;"></button>
        <button class="tono" style="background:#FF4081;"></button>
      </div>

      <div class="divisor"><b>Tierra</b><i></i></div>
      <div class="grilla">
        <button class="tono" style="background:#A0522D;"></button>
        <button class="tono" style="background:#C1440E;"></button>
        <button class="tono" style="background:#9C6644;"></button>
        <button class="tono" style="background:#A67B5B;"></button>
        <button class="tono" style="background:#B7791F;"></button>
        <button class="tono" style="background:#7D6608;"></button>
        <button class="tono" style="background:#8B7355;"></button>
        <button class="tono" style="background:#6E4B3A;"></button>
      </div>

    </div>
  </div>

  <button style="position:absolute;right:18px;bottom:22px;min-width:88px;height:52px;padding:0 22px;border:none;border-radius:3px;background:#27AE60;color:#FFFFFF;font:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px -4px rgba(39,174,96,.6);display:flex;align-items:center;justify-content:center;gap:8px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
    OK
  </button>

</div>
</x-dc>
</body>
</html>
