<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Cuadernillos de estudio de medicina, organizados por materia.">
<title>Wordmed</title>
<link rel="stylesheet" href="fuentes/fuentes.css">
<link rel="stylesheet" href="web/estilos.css">
<script>
/* Aplica el tema guardado antes de pintar, igual que los cuadernillos
   y con la misma clave, para que no se contradigan al abrir un tema. */
(function(){
  try {
    var g = localStorage.getItem('wordmed-tema');
    if (g === 'dark' || g === 'light') document.documentElement.setAttribute('data-theme', g);
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="barra">
  <button class="barra__boton" id="btn-menu" type="button" aria-label="Menú">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
  <span class="barra__titulo" id="barra-titulo">Wordmed</span>
  <button class="barra__boton" id="btn-buscar" type="button" aria-label="Buscar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
  </button>
</header>

<main id="vista" class="vista"></main>

<!-- cajón lateral -->
<div class="velo" id="velo" hidden></div>
<nav class="cajon" id="cajon" hidden aria-label="Opciones">
  <div class="cajon__cabecera">
    <span class="cajon__marca">Wordmed</span>
    <span class="cajon__resumen" id="cajon-resumen"></span>
  </div>
  <div class="cajon__lista">
    <button class="opcion" id="op-tema" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span>Modo oscuro</span>
      <span class="interruptor" id="interruptor-tema"><i></i></span>
    </button>
    <button class="opcion" id="op-editar" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4L10 8h9.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><path d="m15.5 11.5 2 2-3.5 3.5h-2v-2z"/></svg>
      <span>Editar carpetas</span>
      <svg class="opcion__flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg>
    </button>
    <button class="opcion" id="op-actualizar" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 0 0 6.3 5.7L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 13.7 5.3L20 16"/><path d="M20 20v-4h-4"/></svg>
      <span>Buscar actualizaciones</span>
      <span class="opcion__nota" id="estado-actualizacion"></span>
    </button>
  </div>
  <div class="cajon__pie">
    <span class="cajon__hash" id="cajon-hash"></span>
    <span class="cajon__fecha" id="cajon-fecha"></span>
  </div>
</nav>

<!-- buscador -->
<div class="buscador" id="buscador" hidden>
  <div class="buscador__campo">
    <svg class="buscador__lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    <input class="buscador__entrada" id="buscador-entrada" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar en todas las materias">
    <button class="buscador__cancelar" id="btn-cancelar-buscar" type="button">Cancelar</button>
  </div>
  <div class="buscador__resultados" id="buscador-resultados"></div>
</div>

<!-- panel de personalización -->
<div class="velo" id="velo-panel" hidden></div>
<section class="panel" id="panel" hidden aria-label="Personalizar carpeta">
  <div class="panel__asa"></div>
  <div class="panel__encabezado">
    <span class="panel__materia" id="panel-materia"></span>
    <span class="panel__valor" id="panel-valor"></span>
  </div>
  <div class="panel__solapas">
    <button class="solapa activa" id="solapa-colores" type="button">Colores</button>
    <button class="solapa" id="solapa-estilos" type="button">Estilos</button>
  </div>
  <div class="panel__cuerpo" id="panel-cuerpo"></div>
</section>

<button class="ok" id="btn-ok" type="button" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
  OK
</button>

<script src="web/app.js"></script>
</body>
</html>
